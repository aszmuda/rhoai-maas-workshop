apiVersion: maas.opendatahub.io/v1alpha1
kind: MaaSAuthPolicy
metadata:
  name: gpt-oss-20b-model-access
  namespace: models-as-a-service
  annotations:
    openshift.io/display-name: "gpt-oss-20b model access"
    openshift.io/description: "Grants all authenticated users access to the gpt-oss-20b models"
spec:
  modelRefs:
    - name: gpt-oss-20b
      namespace: external-models
  subjects:
    groups:
      - name: system:authenticated
