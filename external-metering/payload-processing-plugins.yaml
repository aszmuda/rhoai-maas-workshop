apiVersion: v1
kind: ConfigMap
metadata:
  annotations:
    opendatahub.io/managed: "false"
  labels:
    app.kubernetes.io/component: api
    app.kubernetes.io/name: maas-api
    app.kubernetes.io/part-of: models-as-a-service
    app.opendatahub.io/modelsasservice: "true"
    maas.opendatahub.io/tenant-name: models-as-a-service
    maas.opendatahub.io/tenant-namespace: models-as-a-service
  name: payload-processing-plugins
  namespace: openshift-ingress
data:
  custom-ipp-config.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: PayloadProcessorConfig
    plugins:
    - type: maas-headers-guard
      name: maas-headers-guard
    - type: stream-usage-enforcer
    - type: model-provider-resolver
    - type: external-metering
      name: external-metering
      parameters:
        meteringURL: http://external-metering-simulator.external-metering.svc.cluster.local:8080
        timeoutSeconds: 5
        featureKey: inference-tokens
        source: maas-gateway
        failOpen: true
    - type: api-translation
    - type: apikey-injection
    profiles:
    - name: default
      plugins:
        request:
        - pluginRef: maas-headers-guard
        - pluginRef: stream-usage-enforcer
        - pluginRef: model-provider-resolver
        - pluginRef: external-metering
        - pluginRef: api-translation
        - pluginRef: apikey-injection
        response:
        - pluginRef: external-metering
  custom-pre-processing-ipp-config.yaml: |
    apiVersion: llm-d.ai/v1alpha1
    kind: PayloadProcessorConfig
    plugins:
    - type: body-field-to-header
      name: model-extractor
      parameters:
        fieldName: model
        headerName: X-Gateway-Model-Name
    - type: model-provider-resolver
    profiles:
    - name: default
      plugins:
        request:
        - pluginRef: model-extractor
        - pluginRef: model-provider-resolver
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: payload-processing-external-metering-egress
  namespace: openshift-ingress
  labels:
    app.kubernetes.io/name: external-metering-simulator
    app.kubernetes.io/part-of: external-metering-simulator
spec:
  podSelector:
    matchLabels:
      maas.opendatahub.io/tenant-instance: payload-processing
  policyTypes:
  - Egress
  egress:
  - to:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: external-metering
      podSelector:
        matchLabels:
          app.kubernetes.io/name: external-metering-simulator
    ports:
    - protocol: TCP
      port: 8080
