apiVersion: v1
kind: Namespace
metadata:
  name: external-metering
  labels:
    app.kubernetes.io/part-of: external-metering-simulator
---
apiVersion: image.openshift.io/v1
kind: ImageStream
metadata:
  name: external-metering-simulator
  namespace: external-metering
  labels:
    app.kubernetes.io/name: external-metering-simulator
    app.kubernetes.io/part-of: external-metering-simulator
spec:
  lookupPolicy:
    local: true
---
apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: external-metering-simulator
  namespace: external-metering
  labels:
    app.kubernetes.io/name: external-metering-simulator
    app.kubernetes.io/part-of: external-metering-simulator
spec:
  runPolicy: Serial
  source:
    type: Git
    binary: null
    git:
      uri: https://github.com/aszmuda/external-metering-simulator.git
      ref: main
    contextDir: simulator
  strategy:
    type: Docker
    dockerStrategy:
      dockerfilePath: Dockerfile
  output:
    to:
      kind: ImageStreamTag
      name: external-metering-simulator:latest
  triggers:
  - type: ConfigChange
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-metering-simulator
  namespace: external-metering
  labels:
    app.kubernetes.io/name: external-metering-simulator
    app.kubernetes.io/part-of: external-metering-simulator
  annotations:
    image.openshift.io/triggers: >-
      [{"from":{"kind":"ImageStreamTag","name":"external-metering-simulator:latest"},"fieldPath":"spec.template.spec.containers[?(@.name==\"external-metering-simulator\")].image"}]
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: external-metering-simulator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-metering-simulator
        app.kubernetes.io/part-of: external-metering-simulator
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: external-metering-simulator
        image: image-registry.openshift-image-registry.svc:5000/external-metering/external-metering-simulator:latest
        imagePullPolicy: Always
        env:
        - name: PORT
          value: "8080"
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 2
          periodSeconds: 5
          timeoutSeconds: 2
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 5
          periodSeconds: 10
          timeoutSeconds: 2
        resources:
          requests:
            cpu: 10m
            memory: 32Mi
          limits:
            cpu: 100m
            memory: 128Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
      terminationGracePeriodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: external-metering-simulator
  namespace: external-metering
  labels:
    app.kubernetes.io/name: external-metering-simulator
    app.kubernetes.io/part-of: external-metering-simulator
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: external-metering-simulator
  ports:
  - name: http
    port: 8080
    targetPort: http
    protocol: TCP
